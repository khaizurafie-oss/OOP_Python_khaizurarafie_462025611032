<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaksi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow-lg">

                <div class="card-header bg-warning text-dark">
                    <h3 class="mb-0">✏ Edit Transaksi</h3>
                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">
                                Nama Pelanggan
                            </label>

                            <input
                                type="text"
                                name="pelanggan"
                                class="form-control"
                                value="{{ transaksi.pelanggan }}"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Jenis Sepatu
                            </label>

                            <input
                                type="text"
                                name="jenis_sepatu"
                                class="form-control"
                                value="{{ transaksi.jenis_sepatu }}"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Layanan
                            </label>

                            <select name="layanan" class="form-select">

                                <option value="Cuci Reguler"
                                    {% if transaksi.layanan == "Cuci Reguler" %}selected{% endif %}>
                                    Cuci Reguler
                                </option>

                                <option value="Cuci Express"
                                    {% if transaksi.layanan == "Cuci Express" %}selected{% endif %}>
                                    Cuci Express
                                </option>

                                <option value="Deep Cleaning"
                                    {% if transaksi.layanan == "Deep Cleaning" %}selected{% endif %}>
                                    Deep Cleaning
                                </option>

                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Harga
                            </label>

                            <input
                                type="number"
                                name="harga"
                                class="form-control"
                                value="{{ transaksi.harga }}"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Status
                            </label>

                            <select name="status" class="form-select">

                                <option value="Diproses"
                                    {% if transaksi.status == "Diproses" %}selected{% endif %}>
                                    Diproses
                                </option>

                                <option value="Selesai"
                                    {% if transaksi.status == "Selesai" %}selected{% endif %}>
                                    Selesai
                                </option>

                                <option value="Sudah Diambil"
                                    {% if transaksi.status == "Sudah Diambil" %}selected{% endif %}>
                                    Sudah Diambil
                                </option>

                            </select>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="/transaksi" class="btn btn-secondary">
                                ⬅ Kembali
                            </a>

                            <button type="submit" class="btn btn-warning">
                                💾 Simpan Perubahan
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
