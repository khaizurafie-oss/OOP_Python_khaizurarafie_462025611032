<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Transaksi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow-lg">

                <div class="card-header bg-success text-white">
                    <h3 class="mb-0">👟 Tambah Transaksi</h3>
                </div>

                <div class="card-body">

                    <form action="/tambah_transaksi" method="POST">

                        <div class="mb-3">
                            <label class="form-label">Nama Pelanggan</label>
                            <input type="text"
                                   name="pelanggan"
                                   class="form-control"
                                   placeholder="Masukkan nama pelanggan"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Jenis Sepatu</label>
                            <input type="text"
                                   name="jenis_sepatu"
                                   class="form-control"
                                   placeholder="Contoh: Nike Air Force 1"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Layanan</label>

                            <select name="layanan" class="form-select">

                                <option value="Cuci Reguler">
                                    Cuci Reguler
                                </option>

                                <option value="Cuci Express">
                                    Cuci Express
                                </option>

                                <option value="Deep Cleaning">
                                    Deep Cleaning
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">
                            <label class="form-label">Harga</label>
                            <input type="number"
                                   name="harga"
                                   class="form-control"
                                   placeholder="Masukkan harga"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Status</label>

                            <select name="status" class="form-select">

                                <option value="Diproses">
                                    Diproses
                                </option>

                                <option value="Selesai">
                                    Selesai
                                </option>

                                <option value="Sudah Diambil">
                                    Sudah Diambil
                                </option>

                            </select>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="/transaksi" class="btn btn-secondary">
                                ⬅ Kembali
                            </a>

                            <button type="submit" class="btn btn-success">
                                💾 Simpan Transaksi
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
